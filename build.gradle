plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    // Forgix merges Fabric + NeoForge JARs into one universal JAR
    id 'io.github.pacifistmc.forgix' version '1.2.9'
}

forgix {
    group = 'nl.requios.effortlessbuilding'
    mergedJarName = "effortlessbuilding-${version}+${project.property('minecraft_version')}.jar"
    outputDir = 'build/libs/merged'

    fabric {
        jarLocation = "build/libs/effortlessbuilding-fabric-${project.property('minecraft_version')}-${version}.jar"
    }
    neoforge {
        jarLocation = "build/libs/effortlessbuilding-neoforge-${project.property('minecraft_version')}-${version}.jar"
    }
}