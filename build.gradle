plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
    // Forgix merges Fabric + NeoForge JARs into one universal JAR
    id 'io.github.pacifistmc.forgix' version '2.0.0-SNAPSHOT.5.1'
}

forgix {
    destinationDirectory = layout.projectDirectory.dir("build/libs/merged")
    archiveClassifier = ""
    archiveVersion = "${version}+${project.property('minecraft_version')}"

    fabric()
    neoforge()
}