plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation("com.terraformersmc:modmenu:11.0.3") { transitive = false }
//    modRuntimeOnly("maven.modrinth:sodium:mc1.21.1-0.6.13-fabric") { transitive = false }
//    modRuntimeOnly("maven.modrinth:sodium-extra:mc1.21.1-0.6.0+fabric") { transitive = false }

    // Required for compilation because common module source files are compiled here too.
    // Only needed during compilation — the mod gracefully handles AE2 absence at runtime.
    compileOnly("org.appliedenergistics:appliedenergistics2:19.2.17")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs '--username', 'Dev'
            programArgs '--uuid', '00000000-0000-0000-0000-000000000000'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}